version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

git:
  branches:
    main: "^main$"
    # Feature branches follow the type/name convention (e.g. chore/docker-sdk-v29);
    # the slash cleanly excludes main. Drives per-branch Harbor dev builds.
    feature: "^[^/]+/.+$"
  tags:
    stable:     { pattern: "^v?\\d+\\.\\d+\\.\\d+$" }
    prerelease: { pattern: "^v?\\d+\\.\\d+\\.\\d+-.+" }
  versioning:
    branch_builds:
      default: { base_from: [stable], format: "{base}-dev+{sha}" }
    no_lineage: { mode: error }

vars:
  org: prplanit
  github_org: PrPlanIT
  gitlab_group: PrPlanIT
  repo: dd-ui
  github_repo: DD-UI

builds:
  # Multi-stage Dockerfile build — the themed error-page nginx/openresty image.
  # Image-only project: no binary engine.
  dd-ui:
    kind: docker
    platforms: [linux/amd64]

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB

repos:
  primary:
    forge: gitlab
    project: "{var:gitlab_group}/{var:repo}"
    roles: [primary]
    branches:
      default: main
    worktree: "."

  github-mirror:
    forge: github
    project: "{var:github_org}/{var:github_repo}"
    roles: [mirror, publish-origin]
    sync:
      git: true
      releases: true

registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{var:org}/{var:repo}"

  harbor:
    provider: harbor
    url: cr.pcfae.com
    credentials: HARBOR
    default_path: "{var:org}/{var:repo}"

  # GitHub Container Registry — second public registry alongside Docker Hub.
  # ghcr namespace = github owner, lowercased ({var:org} == lowercased PrPlanIT).
  ghcr:
    provider: ghcr
    url: ghcr.io
    credentials: GHCR
    default_path: "{var:org}/{var:repo}"

publish:
  # ── Stable releases → all registries (fans via registry: list) ───
  stable:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: dd-ui
    tags: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Pre-releases → all registries ───────────────────────────────
  prerelease:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: dd-ui
    tags: ["v{version}"]
    when: { git_tags: [prerelease], events: [tag] }

  # ── Dev builds on every commit → all registries (retained/pruned) ──
  dev:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: dd-ui
    tags: ["dev-{sha:8}", "latest-dev"]
    when: { branches: [main], events: [push, manual] }
    retention:
      keep_last: 6
      protect: ["latest-dev"]

  # ── Harbor: per-branch dev builds (feature branches → testable images) ──
  # Pushing a feature branch publishes an internal image to pull onto a host and
  # test before merge: cr.pcfae.com/prplanit/dd-ui:dev-<branch>-<sha8> (immutable)
  # + :latest-dev-<branch> (rolling). Kept off public Docker Hub on purpose.
  harbor-branch-dev:
    kind: registry
    registry: [harbor]
    build: dd-ui
    tags: ["dev-{branch}-{sha:8}", "latest-dev-{branch}"]
    when: { branches: [feature], events: [push, manual] }

  # ── Docker Hub: README + description sync ────────────────────────
  project-metadata:
    kind: metadata
    registry: [dockerhub]
    readme: README.md
    description:
      - "DD-UI is a declarative, security-first Docker orchestration engine. Please Docker responsibly."
    when: { branches: [main], events: [push, tag] }

  # ── Primary release (rolling git tag aliases) ────────────────────
  # Authored on the primary forge (GitLab); mirrored to GitHub via
  # repos.github-mirror.sync.releases (no separate github release target).
  primary-release:
    kind: release
    type: latest
    repos: [primary]
    aliases: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

build_cache:
  mode: hybrid
  external:
    registry: harbor
    path: "cache"
    fallback: "main"
  local:
    retention:
      max_age: "7d"
      max_size: "8GB"

commit:
  default_type: docs
  conventional: true
  backend: git

dependency:
  enabled: true
  output: ".stagefreight/deps"
  scope:
    go_modules: true
    dockerfile_env: true
  commit:
    enabled: true
    type: chore
    message: "update managed dependencies"
    push: true
    skip_ci: false

lint:
  level: full
  exclude:
    - "*.png"
    - "*.jpg"
    - "*.gif"
    - "*.svg"
    - "*.ico"
    - "*.webp"
    - "*.woff"
    - "*.woff2"
    - "*.ttf"
    - "example/screenshots/**"
  modules:
    freshness:
      enabled: true
      cache_ttl: 300
      sources:
        docker_images: true
        github_releases: true
      vulnerability:
        enabled: true
      severity:
        # Major-version-behind is advisory, not a build-blocking critical: majors
        # (node 26, compose 5, vite 8, typescript 6, …) need a deliberate tested
        # upgrade, they shouldn't gate every build. CVE-affected deps STILL escalate
        # to critical via severity_override (default on), so real security keeps gating.
        major: 1
    tabs:
      enabled: true
    secrets:
      enabled: true
    conflicts:
      enabled: true
    filesize:
      enabled: true
    unicode:
      enabled: true
      detect_bidi: true
      detect_zero_width: true
      detect_control_ascii: true
    direct-output:
      enabled: true
      exclude:
        - "entrypoint.sh"
    # StageFreight-internal rule (assumes SF's by-design git-less runtime + SF's gitstate
    # pkg). dd-ui's runtime image HAS git (apk add … git, for GitSync) — false positive here.
    no-git-exec:
      enabled: false

test:
  enabled: true
  suites:
    # dd-ui's go.mod lives in api/, so the suite runs from there. No test files
    # yet — this gates them the moment they're added (same as StageFreight itself).
    unit:
      tool: go
      from: api
      packages: [./...]
      race: true
      coverage: true
      gate: perform

release:
  enabled: true
  security_summary: true
  registry_links: true

security:
  enabled: true
  output: ".stagefreight/security"
  sbom: true
  release_detail: full

toolchains:
  want:
    trivy: "0.69.3"
    syft: "1.42.3"
    grype: "0.110.0"
    osv-scanner: "2.3.5"
    cosign: "3.0.6"
  retention:
    keep_last: 2

# stencils: define each renderable once (id → stencil def). Inline defs render a
# badge (default) or a shield (render: shield); named producers render via type.
stencils:
  # ── generated badges ──
  build:          { label: build,      message: "{env:BUILD_STATUS}", color: auto, font: monofur, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}/-/pipelines" }
  license:        { label: license,    message: "AGPL-3.0-or-later", color: "#310937", font: monofur, link: LICENSE }
  release:        { label: release,    message: "v{base}", color: "#74ecbe", font: dejavu-sans, font_size: 11, link: "https://github.com/{var:github_org}/{var:github_repo}/releases" }
  updated:        { label: updated,    message: "{env:BUILD_DATE}", color: "#236144", font: dejavu-sans, font_size: 11 }
  pulls:          { label: pulls,      message: "{docker.pulls}", color: "#1d63ed", link: "https://hub.docker.com/r/{var:org}/{var:repo}" }
  release-latest: { label: latest,     message: "v{base}", color: "#74ecbe", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest" }
  dev-latest:     { label: latest-dev, message: "dev-{sha:8}", color: "#3b82f6", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest-dev" }
  dev-updated:    { label: updated,    message: "{docker.tag.latest-dev.updated}", color: "#236144" }
  dev-size:       { label: size,       message: "{docker.tag.latest-dev.size}", color: "#555", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest-dev" }

  # ── inline shields ──
  donate:  { render: shield, message: donate,  color: "#FF5E5B", logo: ko-fi,          logo_color: white, link: "https://ko-fi.com/T6T41IT163" }
  sponsor: { render: shield, message: sponsor, color: "#EA4AAA", logo: githubsponsors, logo_color: white, link: "https://github.com/sponsors/{var:github_org}" }
  github:  { render: shield, label: GitHub, message: source, color: "#181717", logo: github, link: "https://github.com/{var:github_org}/{var:github_repo}" }
  gitlab:  { render: shield, label: GitLab, message: source, color: "#FC6D26", logo: gitlab, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}" }
  docker:  { render: shield, label: Docker, message: "{var:org}/{var:repo}", color: "#2496ED", logo: docker, logo_color: white, link: "https://hub.docker.com/r/{var:org}/{var:repo}" }

  # ── named producers (repo resolves from repos: publish-origin) ──
  last-commit:  { type: github-last-commit }
  issues-open:  { type: github-issues-open }
  contributors: { type: github-contributors }

scribe:
  # files: one placement region per marked span; items are stencil name-refs.
  files:
    readme.badges:
      file: "README.md"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [build, license, release, updated, donate, sponsor]

    readme.project:
      file: "README.md"
      between: ["<!-- sf:project:start -->", "<!-- sf:project:end -->"]
      inline: true
      items: [github, gitlab, last-commit, issues-open, contributors]

    readme.image:
      file: "README.md"
      between: ["<!-- sf:image:start -->", "<!-- sf:image:end -->"]
      items: [docker, pulls]

  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - ".stagefreight/scribe"
    push: true
    skip_ci: true
